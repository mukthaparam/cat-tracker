<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>CAT plan</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #131211;
    --surface: #1b1917;
    --line: #2a2723;
    --text: #ece5d6;
    --text-dim: #9a9284;
    --text-faint: #5b564a;
    --accent: #c9a66b;
    --accent-soft: rgba(201,166,107,0.13);
    --danger: #b3695c;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--bg);
    color: var(--text);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    padding: 36px 20px 100px;
  }
  .wrap{ max-width: 580px; margin: 0 auto; }

  /* hero */
  .hero{ text-align:center; margin-bottom: 34px; }
  .countdown-num{
    font-family:'Fraunces', serif; font-weight:600; font-size:56px; color: var(--text);
    line-height:1; letter-spacing:-0.01em;
  }
  .countdown-sub{ font-size:12px; color: var(--text-dim); margin-top:6px; letter-spacing:0.03em; }
  .quote{
    font-family:'Fraunces', serif; font-style:italic; font-weight:400; font-size:16px;
    color: var(--text-dim); margin-top:22px; line-height:1.55; padding: 0 10px;
  }

  /* date nav */
  .datebar{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom: 20px;
  }
  .nav{ display:flex; align-items:center; gap:12px; }
  button.arrow{
    background:none; border:none; color: var(--text-dim); cursor:pointer; font-size:17px; padding:2px 4px;
  }
  button.arrow:hover{ color: var(--text); }
  .day-label{ font-size:13px; color: var(--text-dim); text-align:center; min-width:140px; }
  .day-label .day-name{ color: var(--text); font-weight:600; font-family:'Fraunces', serif; font-size:16px; }
  .today-btn{
    background:none; border:1px solid var(--line); color: var(--text-dim);
    padding:6px 13px; border-radius:20px; cursor:pointer; font-size:12px; font-family:'Inter', sans-serif;
  }
  .today-btn:hover{ border-color: var(--accent); color: var(--accent); }

  /* out of range notice */
  .notice{
    text-align:center; color: var(--text-faint); font-size:13px; font-style:italic;
    font-family:'Fraunces', serif; padding: 30px 10px;
  }

  /* exam day */
  .exam-day{ text-align:center; padding: 40px 10px; }
  .exam-day .big{ font-family:'Fraunces', serif; font-size:26px; color: var(--accent); margin-bottom:10px; }
  .exam-day .small{ color: var(--text-dim); font-size:14px; }

  /* phase + test badge */
  .phase-row{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; flex-wrap:wrap; gap:8px; }
  .phase-label{ font-family:'Fraunces', serif; font-style:italic; font-size:13px; color: var(--text-faint); }
  .test-badge{
    background: var(--accent-soft); color: var(--accent); font-size:12px; font-weight:600;
    padding: 5px 13px; border-radius:20px;
  }

  .plan-note{
    font-size:13px; color: var(--text-dim); line-height:1.5; margin-bottom:18px;
    padding: 12px 14px; background: var(--surface); border-radius:10px;
  }

  /* focus section */
  .section{ margin-bottom: 30px; }
  .section-title{
    font-family:'Fraunces', serif; font-weight:600; font-size:15px; margin:0 0 12px;
  }
  .focus-row{ display:flex; gap:10px; padding: 9px 0; border-top:1px solid var(--line); font-size:14px; }
  .focus-row:first-of-type{ border-top:none; }
  .focus-subject{ color: var(--accent); font-weight:600; font-size:12px; letter-spacing:0.03em; width:44px; flex:none; padding-top:1px; }
  .focus-text{ flex:1; color: var(--text); line-height:1.5; }

  /* progress bar */
  .progress-line{ display:flex; align-items:center; gap:10px; margin-bottom:22px; }
  .progress-track{ flex:1; height:3px; background: var(--line); border-radius:2px; overflow:hidden; }
  .progress-fill{ height:100%; background: var(--accent); border-radius:2px; transition: width .25s ease; }
  .progress-label{ font-size:11px; color: var(--text-faint); white-space:nowrap; }

  /* timetable */
  ul.rows{ list-style:none; margin:0; padding:0; }
  ul.rows li{ display:flex; align-items:center; gap:12px; padding: 9px 0; border-top:1px solid var(--line); }
  ul.rows li:first-child{ border-top:none; }

  .check{
    width:16px; height:16px; border-radius:4px; flex:none;
    border:1.3px solid var(--line); cursor:pointer; position:relative;
  }
  .check.done{ background: var(--accent); border-color: var(--accent); }
  .check.done::after{
    content:''; position:absolute; left:4.5px; top:1.5px; width:4px; height:7.5px;
    border-right:1.3px solid #131211; border-bottom:1.3px solid #131211; transform:rotate(40deg);
  }

  .time-label{ font-size:11px; color: var(--text-faint); width:78px; flex:none; font-variant-numeric: tabular-nums; }
  .block-text{ flex:1; font-size:14px; }
  li.done .block-text{ color: var(--text-faint); text-decoration: line-through; }

  /* extra goals */
  .add-row{ display:flex; gap:8px; margin-bottom:10px; }
  .add-row input{
    flex:1; background:none; border:none; border-bottom:1px solid var(--line);
    color: var(--text); padding: 8px 2px; font-size:14px; font-family:'Inter', sans-serif;
  }
  .add-row input::placeholder{ color: var(--text-faint); }
  .add-row input:focus{ outline:none; border-color: var(--accent); }
  .add-row button{
    background:none; border:none; color: var(--text-dim); cursor:pointer; font-size:20px; padding:0 4px;
  }
  .add-row button:hover{ color: var(--accent); }

  .goal-text{ flex:1; font-size:14px; }
  li.done .goal-text{ color: var(--text-faint); text-decoration: line-through; }
  .del{
    background:none; border:none; color: var(--text-faint); cursor:pointer; font-size:15px;
    opacity:0; transition:opacity .12s; flex:none;
  }
  ul.rows li:hover .del{ opacity:1; }
  .del:hover{ color: var(--danger); }
  .empty{ color: var(--text-faint); font-size:13px; padding: 8px 0; font-style:italic; font-family:'Fraunces', serif; }

  .status{ text-align:center; font-size:11px; color: var(--text-faint); margin-top:20px; min-height:14px; }
</style>
</head>
<body>
<div class="wrap">

  <div class="hero">
    <div class="countdown-num" id="countdownNum">--</div>
    <div class="countdown-sub" id="countdownSub">days to CAT · Nov 29, 2026</div>
    <div class="quote" id="quoteLine"></div>
  </div>

  <div class="datebar">
    <div class="nav">
      <button class="arrow" id="prevDay" aria-label="Previous day">&#8249;</button>
      <div class="day-label">
        <div class="day-name" id="dowLabel"></div>
        <div id="dateLabel"></div>
      </div>
      <button class="arrow" id="nextDay" aria-label="Next day">&#8250;</button>
    </div>
    <button class="today-btn" id="todayBtn">Today</button>
  </div>

  <div id="planContent"></div>

  <div class="status" id="statusLine"></div>
</div>

<script>
(function(){

  /* ---------- storage: uses Claude's window.storage when present,
     falls back to localStorage when deployed standalone ---------- */
  async function storageGet(key, shared){
    if(window.storage){ return window.storage.get(key, shared); }
    try{
      var v = localStorage.getItem(key);
      return v !== null ? { key: key, value: v, shared: !!shared } : null;
    }catch(e){ throw e; }
  }
  async function storageSet(key, value, shared){
    if(window.storage){ return window.storage.set(key, value, shared); }
    try{
      localStorage.setItem(key, value);
      return { key: key, value: value, shared: !!shared };
    }catch(e){ throw e; }
  }

  /* ---------- static plan data ---------- */

  var TIMETABLE = [
    {time:'6:00', label:'Wake up'},
    {time:'6:15–8:15', label:'VARC'},
    {time:'9:00–11:00', label:'Unavailable — drop / travel / office'},
    {time:'11:00–1:30', label:'QA'},
    {time:'1:30–2:15', label:'Lunch'},
    {time:'2:15–4:15', label:'DILR'},
    {time:'4:30–7:00', label:'Gym'},
    {time:'7:00–8:00', label:'Dinner / rest'},
    {time:'8:00–9:30', label:'Test / analysis / revision'},
    {time:'9:30–10:00', label:'Light revision'},
    {time:'10:30', label:'Sleep'}
  ];

  var NOV28_TIMETABLE = [
    {time:'Morning', label:'Very light VARC'},
    {time:'Afternoon', label:'QA formula sheet'},
    {time:'Evening', label:'DILR approaches + important mistakes'},
    {time:'Night', label:'Relax. Sleep early.'}
  ];

  var AUG_DAYS = {
    '2026-08-26': { phase:'Setup & baseline', qa:'Percentages basics', dilr:'Tables', varc:'RC basics + 2 RCs' },
    '2026-08-27': { phase:'Setup & baseline', qa:'Percentages advanced', dilr:'Tables / caselets', varc:"Main idea + inference", test:'QA sectional — evening' },
    '2026-08-28': { phase:'Setup & baseline', qa:'Ratio basics', dilr:'Basic arrangements', varc:'2–3 RCs', test:'Revision — evening' },
    '2026-08-29': { phase:'Setup & baseline', test:'Full Mock 1 — baseline', note:"Don't worry about the score. This is your baseline mock." },
    '2026-08-30': { phase:'Setup & baseline', test:'Full Mock 2', note:'Take it normally, then compare against Mock 1.' },
    '2026-08-31': { phase:'Setup & baseline', test:'Deep analysis day', note:'Identify your strongest section, weakest section, accuracy, and time problems. This becomes your September starting point.' }
  };

  var WEEK_BLOCKS = [
    { start:'2026-09-01', end:'2026-09-06', label:'September · Week 1 — Foundation',
      qa:['Arithmetic','Percentages','Ratio & Proportion','Averages'],
      dilr:['Tables','Charts','Basic arrangements'],
      varc:['RC main idea','Inference','Tone','Para Summary'] },
    { start:'2026-09-07', end:'2026-09-13', label:'September · Week 2',
      qa:['Profit & Loss','SI','CI','Mixtures'],
      dilr:['Linear arrangements','Circular arrangements','Ordering','Rankings'],
      varc:["RC inference","Author's purpose",'Para Jumbles','Odd Sentence'] },
    { start:'2026-09-14', end:'2026-09-20', label:'September · Week 3',
      qa:['Time & Work','Pipes & Cisterns','Time-Speed-Distance','Boats & Streams'],
      dilr:['Selection','Distribution','Groups','Teams'],
      varc:['Difficult RCs','Inference','Elimination','Para-based questions'] },
    { start:'2026-09-21', end:'2026-09-27', label:'September · Week 4',
      qa:['Partnership','Arithmetic mixed + revision','Algebra — linear equations','Algebra — quadratics (start)'],
      dilr:['Games','Tournaments','Scheduling'],
      varc:['3 RCs / day','Mixed VA'] },
    { start:'2026-09-28', end:'2026-10-04', label:'September/October · Week 5',
      qa:['Algebra — quadratics','Inequalities','Modulus','Functions'],
      dilr:['Venn diagrams','Networks','Routes'],
      varc:['Mixed RC + VA'] },
    { start:'2026-10-05', end:'2026-10-11', label:'October · Week 1 — CAT level & speed',
      qa:['Functions','Logarithms','AP','GP','Algebra mixed'],
      dilr:['Games','Tournaments','Scheduling','Mixed sets'],
      varc:['3 RCs / day','Timed VA'] },
    { start:'2026-10-12', end:'2026-10-18', label:'October · Week 2 — Geometry',
      qa:['Lines & angles','Triangles','Similarity','Quadrilaterals','Circles'],
      dilr:['Complex arrangements','Distribution','Selection','Mixed CAT sets'],
      varc:['Difficult RCs','CAT PYQs','Timed VA'] },
    { start:'2026-10-19', end:'2026-10-25', label:'October · Week 3',
      qa:['Area','Mensuration','Coordinate Geometry','Number System — divisibility, factors, HCF/LCM, remainders, units digit'],
      dilr:['CAT PYQ sets','Set-selection practice'],
      varc:['CAT PYQs','Difficult RCs'] },
    { start:'2026-10-26', end:'2026-11-01', label:'October · Week 4 — Final syllabus week',
      qa:['Number System (finish)','P&C basics','Probability basics','Set Theory','Mixed QA'],
      dilr:['CAT PYQs','Difficult mixed sets','Previous mock sets'],
      varc:['CAT PYQs','RC','VA','Weak areas'] }
  ];

  var NOV_WEEKS = [
    { start:'2026-11-02', end:'2026-11-08', label:'November · Mocks only — Week 1',
      weekday:{1:"Analyze previous weekend's mocks",2:'Mock analysis + reattempt',3:'Mock analysis + error correction',4:'Mock strategy / review',5:'Light revision'} },
    { start:'2026-11-09', end:'2026-11-15', label:'November · Mocks only — Week 2',
      weekday:{1:'Mock analysis + error correction',2:'Mock analysis + error correction',3:'Mock analysis + error correction',4:'Mock analysis + error correction',5:'Mock analysis + error correction'} },
    { start:'2026-11-16', end:'2026-11-22', label:'November · Mocks only — Week 3',
      weekday:{1:'Analysis + correction — QA: attempt selection & speed',2:'Analysis + correction — DILR: choosing the right sets',3:'Analysis + correction — VARC: RC selection, avoid overthinking',4:'Analysis + correction',5:'Analysis + correction'} },
    { start:'2026-11-23', end:'2026-11-27', label:'November · Final stretch',
      weekday:{1:'Mock analysis',2:'Review previous mistakes',3:'Mock strategy',4:'Weakness correction',5:'Very light revision'} }
  ];

  var PLAN_START = '2026-08-26';
  var CAT_DATE = '2026-11-29';

  var QUOTES = [
    "Small, steady sessions beat rare bursts of effort.",
    "You don't need to solve everything — you need to solve the right things.",
    "Accuracy today is speed tomorrow.",
    "One honest mock review teaches more than three rushed ones.",
    "Selection is a skill. Practice choosing, not just solving.",
    "Progress hides in the boring repetitions.",
    "The mock doesn't judge you. It just shows you where to look next.",
    "Calm and correct beats fast and careless.",
    "Every topic you finish is one less thing to worry about in November.",
    "Consistency compounds — today's hour matters more than it feels like.",
    "You're not behind. You're exactly where today's plan says you should be.",
    "Review the mistake, not just the score.",
    "Discipline now buys ease later.",
    "A clear head solves more questions than a tired one.",
    "Trust the plan on the days you don't trust yourself.",
    "The goal isn't a perfect day. It's a day you didn't skip.",
    "Focus on the next block, not the whole timetable.",
    "Every sectional is a rehearsal, not a verdict.",
    "Rest is part of the plan, not a break from it.",
    "You're building a habit, not chasing a miracle."
  ];

  /* ---------- date helpers ---------- */

  var currentDate = new Date();
  currentDate.setHours(0,0,0,0);

  function fmtKey(d){
    var y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
    return y+'-'+m+'-'+day;
  }
  function fmtDisplay(d){ return d.toLocaleDateString('en-US', { month:'short', day:'numeric' }); }
  function fmtDow(d){ return d.toLocaleDateString('en-US', { weekday:'long' }); }
  function uid(){ return Math.random().toString(36).slice(2,9); }
  function dayOfYear(d){
    var start = new Date(d.getFullYear(),0,0);
    return Math.floor((d - start) / 86400000);
  }
  function inRange(dateStr, start, end){ return dateStr >= start && dateStr <= end; }

  function setStatus(msg, isErr){
    var el = document.getElementById('statusLine');
    el.textContent = msg || '';
    el.style.color = isErr ? 'var(--danger)' : 'var(--text-faint)';
    if(msg){ setTimeout(function(){ if(el.textContent===msg) el.textContent=''; }, 2200); }
  }

  /* ---------- hero: countdown + quote (tied to real today) ---------- */

  function renderHero(){
    var today = new Date(); today.setHours(0,0,0,0);
    var target = new Date(CAT_DATE + 'T00:00:00');
    var days = Math.round((target - today) / 86400000);
    var numEl = document.getElementById('countdownNum');
    var subEl = document.getElementById('countdownSub');
    if(days > 0){ numEl.textContent = days; subEl.textContent = 'days to CAT · Nov 29, 2026'; }
    else if(days === 0){ numEl.textContent = 'Today'; subEl.textContent = 'CAT is today · Nov 29, 2026'; }
    else { numEl.textContent = '—'; subEl.textContent = 'CAT day has passed'; }

    var qIdx = dayOfYear(today) % QUOTES.length;
    document.getElementById('quoteLine').textContent = '“' + QUOTES[qIdx] + '”';
  }

  /* ---------- resolve a day's plan ---------- */

  function getDayPlan(dateObj){
    var key = fmtKey(dateObj);
    var dow = dateObj.getDay();

    if(key === CAT_DATE){ return { examDay:true }; }
    if(key === '2026-11-28'){
      return { phase:'November · Taper day', timetable: NOV28_TIMETABLE,
        note:"No mock today. Don't try to raise your score the day before CAT — just stay light and rest." };
    }
    if(AUG_DAYS[key]){
      var d = AUG_DAYS[key];
      return { phase:d.phase, qa:d.qa, dilr:d.dilr, varc:d.varc, test:d.test, note:d.note, timetable: TIMETABLE };
    }
    for(var i=0;i<WEEK_BLOCKS.length;i++){
      var wb = WEEK_BLOCKS[i];
      if(inRange(key, wb.start, wb.end)){
        var test;
        if(dow===2) test='VARC sectional';
        else if(dow===3) test='DILR sectional';
        else if(dow===4) test='QA sectional';
        else if(dow===6) test='Full Mock 1';
        else if(dow===0) test='Full Mock 2';
        else test='Weakness / revision day';
        return { phase: wb.label, qa: wb.qa.join(', '), dilr: wb.dilr.join(', '), varc: wb.varc.join(', '), test: test, timetable: TIMETABLE };
      }
    }
    for(var j=0;j<NOV_WEEKS.length;j++){
      var nw = NOV_WEEKS[j];
      if(inRange(key, nw.start, nw.end)){
        var ntest;
        if(dow===6) ntest='Full Mock 1';
        else if(dow===0) ntest='Full Mock 2';
        else ntest = nw.weekday[dow] || 'Analysis + correction';
        return { phase: nw.label, test: ntest, timetable: TIMETABLE };
      }
    }
    return null;
  }

  /* ---------- storage for a specific day ---------- */

  async function loadDayState(dateObj){
    var key = 'catplan-day:' + fmtKey(dateObj);
    try{
      var res = await storageGet(key, false);
      return res && res.value ? JSON.parse(res.value) : { timetable: [], extra: [] };
    }catch(e){ return { timetable: [], extra: [] }; }
  }
  async function saveDayState(dateObj, state){
    var key = 'catplan-day:' + fmtKey(dateObj);
    try{ await storageSet(key, JSON.stringify(state), false); }
    catch(e){ setStatus('Could not save — try again', true); }
  }

  var dayState = { timetable: [], extra: [] };
  var currentPlan = null;

  async function loadDay(){
    document.getElementById('dateLabel').textContent = fmtDisplay(currentDate);
    document.getElementById('dowLabel').textContent = fmtDow(currentDate);

    currentPlan = getDayPlan(currentDate);
    dayState = await loadDayState(currentDate);
    renderPlan();
  }

  function renderPlan(){
    var container = document.getElementById('planContent');
    container.innerHTML = '';

    var key = fmtKey(currentDate);
    if(key < PLAN_START){
      container.innerHTML = '<div class="notice">Your CAT plan begins August 26, 2026.</div>';
      return;
    }
    if(!currentPlan){
      container.innerHTML = '<div class="notice">Outside your CAT plan range.</div>';
      return;
    }
    if(currentPlan.examDay){
      container.innerHTML =
        '<div class="exam-day"><div class="big">Today is the day.</div>' +
        '<div class="small">Execute the plan. Trust the preparation.</div></div>';
      return;
    }

    var html = '';

    html += '<div class="phase-row">';
    html += '<span class="phase-label">' + currentPlan.phase + '</span>';
    if(currentPlan.test) html += '<span class="test-badge">Today · ' + currentPlan.test + '</span>';
    html += '</div>';

    if(currentPlan.note){
      html += '<div class="plan-note">' + currentPlan.note + '</div>';
    }

    if(currentPlan.qa || currentPlan.dilr || currentPlan.varc){
      html += '<div class="section"><h2 class="section-title">Focus</h2>';
      if(currentPlan.qa) html += '<div class="focus-row"><span class="focus-subject">QA</span><span class="focus-text">'+currentPlan.qa+'</span></div>';
      if(currentPlan.dilr) html += '<div class="focus-row"><span class="focus-subject">DILR</span><span class="focus-text">'+currentPlan.dilr+'</span></div>';
      if(currentPlan.varc) html += '<div class="focus-row"><span class="focus-subject">VARC</span><span class="focus-text">'+currentPlan.varc+'</span></div>';
      html += '</div>';
    }

    html += '<div class="progress-line"><div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div><span class="progress-label" id="progressLabel">0/0</span></div>';

    html += '<div class="section"><h2 class="section-title">Timetable</h2><ul class="rows" id="timetableList"></ul></div>';

    html += '<div class="section"><h2 class="section-title">Extra goals</h2>';
    html += '<div class="add-row"><input type="text" id="extraInput" placeholder="Anything else for today" /><button id="extraAdd" aria-label="Add goal">+</button></div>';
    html += '<ul class="rows" id="extraList"></ul></div>';

    container.innerHTML = html;

    var blocks = currentPlan.timetable || TIMETABLE;
    if(!Array.isArray(dayState.timetable) || dayState.timetable.length !== blocks.length){
      var padded = [];
      for(var i=0;i<blocks.length;i++) padded.push(!!dayState.timetable[i]);
      dayState.timetable = padded;
    }

    renderTimetable(blocks);
    renderExtra();

    document.getElementById('extraAdd').onclick = addExtra;
    document.getElementById('extraInput').addEventListener('keydown', function(e){ if(e.key==='Enter') addExtra(); });

    updateProgress(blocks);
  }

  function renderTimetable(blocks){
    var listEl = document.getElementById('timetableList');
    listEl.innerHTML = '';
    blocks.forEach(function(b, idx){
      var done = !!dayState.timetable[idx];
      var li = document.createElement('li');
      if(done) li.className = 'done';

      var check = document.createElement('div');
      check.className = 'check' + (done ? ' done' : '');
      check.onclick = function(){
        dayState.timetable[idx] = !dayState.timetable[idx];
        renderTimetable(blocks);
        updateProgress(blocks);
        saveDayState(currentDate, dayState);
      };
      li.appendChild(check);

      var time = document.createElement('span');
      time.className = 'time-label';
      time.textContent = b.time;
      li.appendChild(time);

      var text = document.createElement('span');
      text.className = 'block-text';
      text.textContent = b.label;
      li.appendChild(text);

      listEl.appendChild(li);
    });
  }

  function renderExtra(){
    var listEl = document.getElementById('extraList');
    listEl.innerHTML = '';
    if(!dayState.extra || dayState.extra.length === 0){
      var empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = 'Nothing extra added yet.';
      listEl.appendChild(empty);
      return;
    }
    dayState.extra.forEach(function(item){
      var li = document.createElement('li');
      if(item.done) li.className = 'done';

      var check = document.createElement('div');
      check.className = 'check' + (item.done ? ' done' : '');
      check.onclick = function(){
        item.done = !item.done;
        renderExtra();
        saveDayState(currentDate, dayState);
      };
      li.appendChild(check);

      var text = document.createElement('div');
      text.className = 'goal-text';
      text.textContent = item.text;
      li.appendChild(text);

      var del = document.createElement('button');
      del.className = 'del';
      del.textContent = '×';
      del.setAttribute('aria-label','Delete goal');
      del.onclick = function(){
        dayState.extra = dayState.extra.filter(function(g){ return g.id !== item.id; });
        renderExtra();
        saveDayState(currentDate, dayState);
      };
      li.appendChild(del);

      listEl.appendChild(li);
    });
  }

  function addExtra(){
    var input = document.getElementById('extraInput');
    var val = input.value.trim();
    if(!val){ setStatus('Type something first', true); input.focus(); return; }
    dayState.extra.push({ id: uid(), text: val, done:false });
    input.value = '';
    renderExtra();
    saveDayState(currentDate, dayState);
  }

  function updateProgress(blocks){
    var total = blocks.length + (dayState.extra ? dayState.extra.length : 0);
    var done = dayState.timetable.filter(Boolean).length + (dayState.extra ? dayState.extra.filter(function(g){return g.done;}).length : 0);
    var pct = total ? Math.round(100*done/total) : 0;
    var fill = document.getElementById('progressFill');
    var label = document.getElementById('progressLabel');
    if(fill) fill.style.width = pct + '%';
    if(label) label.textContent = done + '/' + total;
  }

  document.getElementById('prevDay').onclick = function(){ currentDate.setDate(currentDate.getDate()-1); loadDay(); };
  document.getElementById('nextDay').onclick = function(){ currentDate.setDate(currentDate.getDate()+1); loadDay(); };
  document.getElementById('todayBtn').onclick = function(){
    currentDate = new Date(); currentDate.setHours(0,0,0,0);
    loadDay();
  };

  renderHero();
  loadDay();
})();
</script>
</body>
</html>
